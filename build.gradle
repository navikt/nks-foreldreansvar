plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jmailen.kotlinter' version '5.7.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'no.nav.nks.foreldreansvar'
version = '0.0.1'

repositories {
    mavenCentral()
    // Confluent's Avro serializer (used to read pdl.leesah-v1) is only published here.
    maven { url = 'https://packages.confluent.io/maven/' }
}

kotlin {
    jvmToolchain(21)
}

application {
    mainClass = 'no.nav.nks.foreldreansvar.BootstrapKt'
}

dependencies {
    implementation platform('io.netty:netty-bom:4.2.17.Final')
    implementation 'io.ktor:ktor-server-core:3.6.0'
    implementation 'io.ktor:ktor-server-netty:3.6.0'
    implementation 'io.ktor:ktor-server-content-negotiation:3.6.0'
    implementation 'io.ktor:ktor-server-auth:3.6.0'
    implementation 'io.ktor:ktor-server-status-pages:3.6.0'
    implementation 'io.ktor:ktor-server-auth-jwt:3.6.0'
    implementation 'io.ktor:ktor-serialization-jackson:3.6.0'
    implementation 'io.ktor:ktor-client-core:3.6.0'
    implementation 'io.ktor:ktor-client-cio:3.6.0'
    implementation 'io.ktor:ktor-client-content-negotiation:3.6.0'
    implementation 'io.ktor:ktor-server-metrics-micrometer:3.6.0'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.17.2'
    implementation 'ch.qos.logback:logback-classic:1.5.34'
    // JSON log lines, so Grafana/Loki sees level, logger and thread as fields. 8.x uses Jackson 2 like Ktor (9.x needs Jackson 3).
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
    // Brings in Confluent's build of kafka-clients (x.y.z-ccs) that matches the serializer, so we don't pin kafka-clients ourselves.
    implementation 'io.confluent:kafka-avro-serializer:8.3.2'

    testImplementation 'io.ktor:ktor-server-test-host:3.6.0'
    testImplementation 'io.ktor:ktor-client-mock:3.6.0'
    testImplementation 'no.nav.security:mock-oauth2-server:6.0.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    archiveFileName = 'app.jar'
    mergeServiceFiles()
    // Shadow 9 excludes duplicates by default; include files that transformers must merge.
    filesMatching(['META-INF/services/**', 'META-INF/*.kotlin_module']) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}
