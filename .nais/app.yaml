apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nks-foreldreansvar
  namespace: teamnks
spec:
  ingresses:
    - https://nks-foreldreansvar.intern.dev.nav.no
  port: 8080
  liveness:
    path: /internal/isalive
    initialDelay: 10
  readiness:
    path: /internal/isready
    initialDelay: 10
  replicas:
    max: 4
    min: 1
  resources:
    # The Kafka client and Avro need more memory than the HTTP API alone.
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no # Entra ID dev tenant
  # Gives us Kafka credentials and schema registry access (KAFKA_* env vars). Topic access is granted by the topic owner's ACL.
  kafka:
    pool: nav-dev
  env:
    # PDL in dev-fss, reached from dev-gcp through its public ingress.
    - name: PDL_URL
      value: https://pdl-api.dev-fss-pub.nais.io/graphql
    # Who we ask Texas for a token to: <cluster>:<namespace>:<app>.
    - name: PDL_TARGET
      value: dev-fss:pdl:pdl-api
    # Registered processing purpose for our PDL lookups. Sent as the Behandlingsnummer header.
    - name: PDL_BEHANDLINGSNUMMER
      value: B118
    # Leesah consumer. PDL has given us read access to pdl.leesah-v1 in dev (navikt/pdl#4450).
    # Set to "false" to turn the consumer off without a code change.
    - name: LEESAH_ENABLED
      value: "true"
    - name: LEESAH_TOPIC
      value: pdl.leesah-v1
    # Comma-separated. PDL publishes FORELDREANSVAR_V1 on Leesah in dev.
    - name: LEESAH_OPPLYSNINGSTYPER
      value: FORELDREANSVAR_V1
    # All four, so we can see in the logs what PDL sends for each kind of change.
    - name: LEESAH_ENDRINGSTYPER
      value: OPPRETTET,KORRIGERT,OPPHOERT,ANNULLERT
  accessPolicy:
    outbound:
      # PDL runs in dev-fss (on-prem), so we call it as an external host.
      # outbound.rules only covers apps in the same GCP environment, so no rule is needed here.
      external:
        - host: pdl-api.dev-fss-pub.nais.io
    inbound:
      rules:
        # Salesforce reaches us via saas-proxy, which calls us with its own token.
        # Same cluster (dev-gcp), so no cluster field is needed.
        - application: saas-proxy
          namespace: platforce
