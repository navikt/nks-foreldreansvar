apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nks-foreldreansvar
  namespace: teamnks
spec:
  ingresses:
    - https://nks-foreldreansvar.intern.dev.nav.no
  port: 8080
  liveness:
    path: /internal/isalive
    initialDelay: 10
  readiness:
    path: /internal/isready
    initialDelay: 10
  replicas:
    max: 4
    min: 1
  resources:
    limits:
        memory: 128Mi
    requests:
      cpu: 50m
      memory: 96Mi