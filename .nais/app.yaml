apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nks-foreldreansvar
  namespace: teamnks
spec:
  ingresses:
    - https://nks-foreldreansvar.intern.dev.nav.no
  port: 8080
  ttl: 3h # Time before clean-up (1)
  replicas:
    max: 4
    min: 1
  resources:
